{{- if eq .Values.networkPolicy.enabled true }}
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: global-pull-secret-allow-egress
  namespace: openshift-config
  labels:
    {{- include "workspace-images.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  podSelector:
    matchLabels:
      job-name: update-global-pull-secret
  egress:
    - ports:
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 5353
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
  policyTypes:
    - Egress
{{- end }}